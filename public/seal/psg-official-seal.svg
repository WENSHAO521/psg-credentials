  <!-- red accent ring -->
  <circle cx="200" cy="200" r="172" fill="none" stroke="#E30613" stroke-width="1.5"/>

  <!-- main ring -->
  <circle cx="200" cy="200" r="164" fill="none" stroke="#000000" stroke-width="4"/>

  <!-- ring text -->
  <text font-family="Arial, sans-serif" font-weight="700" font-size="15" letter-spacing="4" fill="#000000">
    <textPath href="#ringTop" startOffset="50%" text-anchor="middle">PANORAMA SCHOLARLY GROUP</textPath>
  </text>
  <text font-family="Arial, sans-serif" font-weight="600" font-size="13" letter-spacing="3" fill="#E30613">
    <textPath href="#ringBottom" startOffset="50%" text-anchor="middle">ZERTIFIZIERT &#183; CERTIFIED</textPath>
  </text>

  <!-- separators between top/bottom ring text, echoing the logo's accent square -->
  <rect x="47" y="195" width="10" height="10" fill="#E30613" transform="rotate(45 52 200)"/>
  <rect x="343" y="195" width="10" height="10" fill="#E30613" transform="rotate(45 348 200)"/>

  <!-- inner hairline framing the monogram -->
  <circle cx="200" cy="200" r="132" fill="none" stroke="#6B6D72" stroke-width="1"/>

  <!-- center monogram, reduced from the primary logo mark -->
  <g transform="translate(200,200) scale(0.85) translate(-95,-100)">
    <rect x="0" y="0" width="30" height="200" fill="#000000"/>
    <path d="M30 0 H120 C150 0, 150 70, 120 70 H30 Z" fill="#E30613"/>
    <path d="M0 100 H120 V130 H30 V150 H120 V200 H0 V170 H90 V150 H0 Z" fill="#000000"/>
    <path d="M150 200 H50 V170 H150 V50 H180 V200 Z" fill="#000000"/>
