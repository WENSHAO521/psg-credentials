<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PSG Credentials</title>
    <meta
      name="description"
      content="Official credential verification registry for Panorama Scholarly Group -- editorial appointments, Research Institute fellowships, paper awards, and conference invitations."
    />

    <!-- Site-wide social preview. Every route shares this (it's a plain SPA,
         no server rendering), so it can't show a specific person's name/role
         when a certificate link is shared -- that would need a small edge
         function generating per-record tags, which isn't built yet. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PSG Credentials" />
    <meta property="og:title" content="PSG Credentials" />
    <meta
      property="og:description"
      content="Official credential verification registry for Panorama Scholarly Group."
    />
    <meta property="og:image" content="https://credentials.panorama-sg.com/icon-512.png" />
    <meta property="og:url" content="https://credentials.panorama-sg.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="PSG Credentials" />
    <meta
      name="twitter:description"
      content="Official credential verification registry for Panorama Scholarly Group."
    />
    <meta name="twitter:image" content="https://credentials.panorama-sg.com/icon-512.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
