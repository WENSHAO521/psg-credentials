name: Validate certificate data

on:
  pull_request:
    paths:
      - 'source/certificates.csv'
      - 'source/editorial-boards.csv'
      - 'source/journals.csv'
      - 'scripts/**'
  push:
    branches: [master]
    paths:
      - 'source/certificates.csv'
      - 'source/editorial-boards.csv'
      - 'source/journals.csv'
      - 'scripts/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --omit=dev papaparse
      - run: node scripts/validate-data.js
      # Informational only -- audit-roster never fails the build (it reports
      # drift between the reference roster and issued certificates, which is
      # often a to-do, not a broken CSV), it just leaves a record in the log
      # instead of relying on someone remembering to run it by hand.
      - run: node scripts/audit-roster.js
