name: Validate certificate data

on:
  pull_request:
    paths:
      - 'source/certificates.csv'
      - 'scripts/**'
  push:
    branches: [main]
    paths:
      - 'source/certificates.csv'
      - 'scripts/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=dev papaparse
      - run: node scripts/validate-data.js
