name: Certificate lifecycle

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: certificate-lifecycle
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --omit=dev papaparse

      - id: prune
        run: node scripts/prune-expired.js

      - name: Commit removed records
        if: steps.prune.outputs.removed_count != '0'
        run: |
          git config user.name "psg-credentials-bot"
          git config user.email "actions@users.noreply.github.com"
          git add source/certificates.csv
          git commit -m "Remove ${{ steps.prune.outputs.removed_count }} certificate(s) past their removal grace period"
          git push

      - name: Report to tracking issue
        if: steps.prune.outputs.has_summary == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('prune-summary.json', 'utf8'));

            function table(rows, cols) {
              if (!rows.length) return '_None._';
              const header = `| ${cols.join(' | ')} |`;
              const sep = `| ${cols.map(() => '---').join(' | ')} |`;
              const body = rows.map((r) => `| ${cols.map((c) => r[c] ?? '').join(' | ')} |`).join('\n');
              return [header, sep, body].join('\n');
            }

            const body = [
              `Last checked: ${summary.checked_on}`,
              '',
              `### Removed this run (${summary.removed.length})`,
              table(summary.removed, ['certificate_id', 'display_name', 'journal', 'reason']),
              '',
              `### Approaching removal within 14 days (${summary.upcoming.length})`,
              table(summary.upcoming, ['certificate_id', 'display_name', 'journal', 'reason', 'purge_date']),
              '',
              'Review before the removal date if a certificate should be kept: set `status` back to `active` with an extended `valid_until`, or otherwise correct `source/certificates.csv`, before the next scheduled run.',
            ].join('\n');

            const title = 'Certificate Registry: Lifecycle Report';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'lifecycle-report',
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['lifecycle-report'],
              });
            }
